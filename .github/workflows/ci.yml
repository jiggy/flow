name: CI
on:
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch:
    inputs:
      docs_base_revision:
        description: Baseline commit for documentation checks
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  candidate-build:
    name: Build candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: 1.43.1
      - run: python -m pip install build==1.3.0 twine==6.2.0 mypy==1.18.2
      - run: node scripts/ci/flow-candidates.mjs build "$RUNNER_TEMP/candidates"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flow-candidates-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidates
          retention-days: 7
          if-no-files-found: error
          overwrite: true
  quick-checks:
    name: Quick development checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: 1.43.1
      - run: bun install --ignore-scripts
      - run: just test-tooling
      - name: Check skill references against canonical documentation
        run: just check-skills
  source-tests:
    name: Source and protocol checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: 1.43.1
      - run: python -m pip install build==1.3.0 twine==6.2.0 mypy==1.18.2
      - run: |-
          bun install --ignore-scripts
          bun install --cwd conformance/run-0 --frozen-lockfile --ignore-scripts
      - run: |-
          just build
          FLOW_NODE=$(command -v node) PYTHON=$(command -v python) just test
  sites:
    name: Build public sites
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3
      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b
        with:
          just-version: 1.43.1
      - name: Check documentation source and checker regressions
        env:
          DOCS_BASE_REVISION: ${{ github.event.pull_request.base.sha || inputs.docs_base_revision || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || format('{0}^', github.sha) }}
        run: |-
          bun test scripts/check-docs.test.ts
          bun scripts/check-docs.ts
      - run: bun install --cwd site --frozen-lockfile --ignore-scripts
      - name: Build FLOW documentation
        env:
          DOCS_BASE_REVISION: ${{ github.event.pull_request.base.sha || inputs.docs_base_revision || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || format('{0}^', github.sha) }}
        run: |-
          scripts/build-site.sh flow "$RUNNER_TEMP/sites/flow"
          bun scripts/check-docs.ts --sites "$RUNNER_TEMP/sites"
      - name: Record checked site identity
        run: node scripts/ci/site-evidence.mjs "$RUNNER_TEMP/sites/flow" "$GITHUB_SHA"
  npm-installed:
    name: Npm installed (${{ matrix.os }}, ${{ matrix.node }})
    needs:
      - candidate-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
        node:
          - "22"
          - "24"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: flow-candidates-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: candidates
      - run: bun install --ignore-scripts
      - shell: bash
        run: |-
          node scripts/ci/flow-candidates.mjs verify candidates "$GITHUB_SHA"
          FLOW_NODE=$(command -v node) FLOW_SDK_PACKAGE_ARCHIVE=$(realpath candidates/flow-sdk/*.tgz) bun packages/flow-sdk/test/package-smoke.ts
          node scripts/test-authoring-package.mjs candidates/flow-authoring/*.tgz
          node scripts/ci/flow-candidates.mjs verify candidates "$GITHUB_SHA"
  python-installed:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    needs:
      - candidate-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"
          - os: ubuntu-24.04
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.13"
          - os: ubuntu-24.04
            python: "3.14"
          - os: macos-14
            python: "3.14"
          - os: windows-2022
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: flow-candidates-${{ github.sha }}-r${{ github.run_id }}-a${{ github.run_attempt }}
          path: candidates
      - run: python -m pip install mypy==1.18.2
      - shell: bash
        run: |-
          node scripts/ci/flow-candidates.mjs verify candidates "$GITHUB_SHA"
          python packages/jiggy-flow/tests/package_smoke.py candidates/python/*.whl candidates/python/*.tar.gz
          node scripts/ci/flow-candidates.mjs verify candidates "$GITHUB_SHA"
  test:
    if: always()
    needs:
      - candidate-build
      - quick-checks
      - source-tests
      - sites
      - npm-installed
      - python-installed
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: node -e 'const rows=Object.values(JSON.parse(process.env.RESULTS));if(rows.length!==6||rows.some(row=>row.result!=="success"))process.exit(1)'
