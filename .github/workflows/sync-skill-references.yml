name: Sync skill references
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
permissions:
  contents: read
concurrency:
  group: sync-skill-references-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.3
      - name: Install synchronization dependencies
        run: bun install --ignore-scripts
      - name: Synchronize canonical references
        run: node scripts/sync-skills.mjs
      - name: Commit and push generated references
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |-
          git add -- ':(glob)skills/*/reference/**'
          if git diff --cached --quiet; then
            exit 0
          fi
          git diff --cached --name-only | while IFS= read -r path; do
            case "$path" in
              skills/*/reference/*) ;;
              *) echo "Refusing unrelated staged path: $path" >&2; exit 1 ;;
            esac
          done
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --signoff -m "chore: sync FLOW skill references"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$PR_BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Check the updated branch
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: gh workflow run ci.yml --ref "$PR_BRANCH" --field docs_base_revision="$PR_BASE_SHA"
