on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: flow-npm-publication
  cancel-in-progress: false
name: Publish FLOW npm packages
jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    environment: npm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Authorize exact qualified producer
        id: authorized
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/flow-release.mjs authorize "${{ github.event.workflow_run.id }}" "${{ github.event.workflow_run.run_attempt }}"
      - name: Download and verify exact artifact bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/flow-release.mjs download "${{ github.event.workflow_run.id }}" "${{ github.event.workflow_run.run_attempt }}" candidates
      - name: Revalidate after queueing and download
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/flow-release.mjs verify "${{ github.event.workflow_run.id }}" "${{ github.event.workflow_run.run_attempt }}" candidates
      - run: npm install --global npm@11.6.2
      - name: Publish exact qualified npm archives
        run: node scripts/ci/publish-npm.mjs candidates
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
